<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A-Z</title>
<meta name="description" content="A-Z: picture routines, timers, reminders, rewards and calm-down tools for kids and families. Demo with a pretend family.">
<meta name="theme-color" content="#EDF1F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;600;700&family=Fredoka:wght@400;500;600;700&family=Shrikhand&family=Silkscreen&display=swap">
<style>
/* Layout: phone-first single-column app shell; sticky top bar, fixed bottom tab bar, content capped at 680px. */
:root {
  --bg: #EDF1F8;
  --surface: #FFFFFF;
  --surface-2: #F5F7FC;
  --ink: #1A2233;
  --muted: #586276;
  --line: #D6DDEA;
  --primary: #2556D0;
  --on-primary: #FFFFFF;
  --star: #E9A300;
  --star-soft: #FFF2CC;
  --good: #1F7F4A;
  --good-soft: #DDF3E6;
  --hard: #B9561A;
  --hard-soft: #FCE7DA;
  --rough: #4F6290;
  --rough-soft: #E2E8F4;
  --danger: #B92E25;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 6px 18px rgba(20, 30, 60, .07);
  --font-display: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
  --kid: #2556D0;
  --kid-soft: #2556D01F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141D; --surface: #1A2030; --surface-2: #222A3C; --ink: #EDF1F8; --muted: #A4ADC2; --line: #333C52;
    --primary: #7D9DFF; --on-primary: #0E1424; --star: #FFC83D; --star-soft: #3A3115; --good: #5BD08E; --good-soft: #173526;
    --hard: #FF9E66; --hard-soft: #3E2618; --rough: #A3B4E0; --rough-soft: #232C42; --danger: #FF7A70; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141D; --surface: #1A2030; --surface-2: #222A3C; --ink: #EDF1F8; --muted: #A4ADC2; --line: #333C52;
  --primary: #7D9DFF; --on-primary: #0E1424; --star: #FFC83D; --star-soft: #3A3115; --good: #5BD08E; --good-soft: #173526;
  --hard: #FF9E66; --hard-soft: #3E2618; --rough: #A3B4E0; --rough-soft: #232C42; --danger: #FF7A70; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; font-weight: 800; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }

#app { min-height: 100%; }
.page { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 120px; display: grid; gap: 16px; }
.page.no-tabs { padding-bottom: 40px; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-in { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 10px; min-height: 60px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .mark { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .95rem; letter-spacing: 0; }
.top .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; white-space: nowrap; }
.chip.star { background: var(--star-soft); color: var(--ink); }
.chip.btn { min-height: 40px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
.who-chip { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who-chip .ava-s { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--kid-soft); font-size: 1.3rem; flex: none; }
.who-chip b { font-family: var(--font-display); font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 14px; font-weight: 700; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.btn.kid { background: var(--kid); color: #fff; box-shadow: none; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 2px var(--danger); }
.btn.big { min-height: 64px; font-size: 1.25rem; font-family: var(--font-display); border-radius: 18px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.stack.tight { gap: 8px; }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.soft { background: var(--kid-soft); box-shadow: none; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); color: var(--muted); font-size: .92rem; }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty .big-e { font-size: 3rem; }

/* Who's using */
.hello { display: grid; gap: 4px; padding-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 12px 16px; display: grid; justify-items: center; gap: 6px; text-align: center; border-top: 6px solid var(--kid); }
.tile .ava { width: 82px; height: 82px; border-radius: 26px; display: grid; place-items: center; font-size: 3rem; background: var(--kid-soft); }
.tile .nm { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1.1; overflow-wrap: anywhere; }
.tile .sub { font-size: .85rem; color: var(--muted); font-weight: 700; }
.grown { justify-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; color: var(--muted); min-height: 48px; }

/* Code pad */
.pad-wrap { display: grid; gap: 18px; justify-items: center; text-align: center; padding-top: 12px; }
.pad-ava { width: 96px; height: 96px; border-radius: 30px; display: grid; place-items: center; font-size: 3.4rem; background: var(--kid-soft); }
.dots { display: flex; gap: 14px; justify-content: center; min-height: 26px; }
.dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--kid); display: grid; place-items: center; font-size: .95rem; }
.dot.on { background: var(--kid); }
.dots.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
.pad { display: grid; gap: 10px; width: 100%; max-width: 360px; }
.pad.nums { grid-template-columns: repeat(3, 1fr); }
.pad.pics { grid-template-columns: repeat(4, 1fr); }
.pad.letters { grid-template-columns: repeat(6, 1fr); max-width: 420px; }
.key { min-height: 64px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; display: grid; place-items: center; }
.pad.letters .key { min-height: 52px; font-size: 1.25rem; border-radius: 14px; }
.pad.pics .key { font-size: 2.1rem; min-height: 70px; }
.key.fn { background: transparent; box-shadow: inset 0 0 0 2px var(--line); font-size: 1.1rem; }
.key:active { transform: scale(.96); }
.pad-msg { min-height: 1.4em; font-weight: 700; color: var(--hard); }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(20, 30, 60, .06); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 680px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tab { display: grid; justify-items: center; gap: 0; padding: 8px 2px 8px; font-size: .74rem; font-weight: 700; color: var(--muted); min-height: 60px; }
.tab .ti { font-size: 1.45rem; line-height: 1.2; }
.tab.on { color: var(--ink); }
.tab.on .ti { transform: translateY(-1px); }
.tab.on::after { content: ""; width: 26px; height: 4px; border-radius: 4px; background: var(--kid); margin-top: 3px; }
.tab .badge { position: absolute; }

/* Today */
.greet { display: grid; gap: 10px; }
.progress { height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.progress > i { display: block; height: 100%; background: var(--kid); border-radius: 999px; transition: width .4s; }
.section { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.sec-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--kid-soft); }
.sec-head .se { font-size: 1.5rem; }
.sec-head h2 { flex: 1; font-size: 1.3rem; }
.sec-head .cnt { font-weight: 700; color: var(--muted); }
.steps { display: grid; }
.step { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-top: 1px solid var(--line); min-height: 76px; }
.step:first-child { border-top: 0; }
.step .main { flex: 1; display: flex; align-items: center; gap: 12px; text-align: left; min-width: 0; padding: 4px 0; }
.pic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 2rem; background: var(--surface-2); flex: none; overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.step .txt { display: grid; gap: 2px; min-width: 0; }
.step .lbl { font-family: var(--font-display); font-weight: 700; font-size: 1.18rem; line-height: 1.15; overflow-wrap: anywhere; }
.step .sub { font-size: .86rem; color: var(--muted); }
.time { display: inline-block; padding: 2px 8px; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: .8rem; margin-right: 6px; }
.check { width: 52px; height: 52px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--line); display: grid; place-items: center; font-size: 1.6rem; flex: none; color: transparent; }
.step.done .check { background: var(--good); box-shadow: none; color: #fff; }
.step.done .lbl { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.mini { min-height: 40px; padding: 6px 12px; border-radius: 12px; font-weight: 700; font-size: .85rem; background: var(--kid-soft); color: var(--ink); flex: none; }
.say { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 1.25rem; background: var(--surface-2); flex: none; }
.checkin { padding: 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.checkin .q { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.faces { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.face { min-height: 70px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 1rem; box-shadow: inset 0 0 0 2px var(--line); }
.face .fe { font-size: 2rem; }
.face.on.good { background: var(--good-soft); box-shadow: inset 0 0 0 3px var(--good); }
.face.on.notyet { background: var(--hard-soft); box-shadow: inset 0 0 0 3px var(--hard); }
.faces.three { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.faces.three .face { flex-direction: column; gap: 4px; min-height: 84px; padding: 8px 4px; font-size: .92rem; line-height: 1.15; text-align: center; }
.face.on.rough { background: var(--rough-soft); box-shadow: inset 0 0 0 3px var(--rough); }
.roughnote { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 14px; background: var(--rough-soft); font-weight: 600; font-size: .92rem; }

/* Little focus card */
.focus { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 22px 18px; display: grid; gap: 14px; justify-items: center; text-align: center; border-top: 8px solid var(--kid); }
.focus .fpic { width: 168px; height: 168px; border-radius: 40px; display: grid; place-items: center; font-size: 6.2rem; background: var(--kid-soft); overflow: hidden; }
.focus .fpic img { width: 100%; height: 100%; object-fit: cover; }
.focus .flbl { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1.05; overflow-wrap: anywhere; }
.focus .fstep { font-weight: 700; color: var(--muted); }

/* Star burst */
.burst { position: fixed; z-index: 60; pointer-events: none; font-size: 2.2rem; animation: burst .9s ease-out forwards; }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1 } 60% { opacity: 1 } 100% { transform: translate(-50%, -160%) scale(1.4); opacity: 0 } }

/* Timer */
.timer-card { display: grid; gap: 18px; justify-items: center; text-align: center; }
.dial { --p: 1; --tc: #E5484D; width: min(78vw, 320px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 10px var(--surface-2); display: grid; place-items: center; }
.dial::before { content: ""; position: absolute; inset: 18px; border-radius: 50%; background: conic-gradient(var(--tc) calc(var(--p) * 1turn), transparent 0); transition: background .2s; }
.dial::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: repeating-conic-gradient(var(--line) 0 1deg, transparent 1deg 30deg); -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%); mask: radial-gradient(circle, transparent 66%, #000 67%); }
.dial .face-in { position: relative; z-index: 1; width: 56%; aspect-ratio: 1; border-radius: 50%; background: var(--surface); display: grid; place-items: center; align-content: center; gap: 0; box-shadow: var(--shadow); }
.dial .tl { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 9vw, 2.9rem); line-height: 1; }
.dial .tlab { font-size: .85rem; color: var(--muted); font-weight: 700; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dial.warn { animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.03) } }
.presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pre { min-width: 64px; min-height: 48px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; padding: 0 12px; }
.pre.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.swatches { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.sw { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.6); }
.sw.on { outline: 3px solid var(--ink); outline-offset: 2px; }
.stepper { display: inline-flex; align-items: center; gap: 12px; }
.stepper button { width: 48px; height: 48px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); font-size: 1.4rem; font-weight: 700; }
.stepper output { min-width: 96px; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; text-align: center; }
.timer-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; min-height: 40px; }

/* Overlay + toast */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 24, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(100%, 440px); background: var(--surface); border-radius: 26px; padding: 24px 20px; display: grid; gap: 14px; justify-items: center; text-align: center; box-shadow: var(--shadow); max-height: 100%; overflow: auto; }
.sheet .bige { font-size: 4.4rem; line-height: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 55; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-weight: 700; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Calm */
.calm-steps { display: flex; gap: 6px; justify-content: center; }
.calm-steps i { width: 34px; height: 6px; border-radius: 6px; background: var(--line); }
.calm-steps i.on { background: var(--kid); }
.bigfaces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bigface { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; font-size: .92rem; }
.bigface .fe { font-size: 3rem; line-height: 1; }
.bigface.lv-calm { border-bottom: 6px solid var(--good); }
.bigface.lv-wiggly { border-bottom: 6px solid var(--star); }
.bigface.lv-upset { border-bottom: 6px solid var(--danger); }
.feelings { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.feel { min-height: 60px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; padding: 6px; }
.feel .fe { font-size: 1.7rem; }
.feel.on { box-shadow: inset 0 0 0 3px var(--kid); background: var(--kid-soft); }
.breath { width: 210px; height: 210px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.breath::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--kid-soft); box-shadow: inset 0 0 0 4px var(--kid); transform: scale(.55); animation: breathe 8s ease-in-out infinite; }
.breath span { position: relative; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; }
@keyframes breathe { 0%, 100% { transform: scale(.55) } 50% { transform: scale(1) } }
.stopsign { width: 150px; height: 150px; display: grid; place-items: center; background: var(--danger); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 2rem; clip-path: polygon(29% 0, 71% 0, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0 71%, 0 29%); }

/* Cards grid (moves, calm moves, rewards) */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.mcard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 6px; justify-items: center; text-align: center; align-content: start; }
.mcard .me { font-size: 2.6rem; line-height: 1.1; }
.mcard .mn { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; line-height: 1.1; }
.mcard .mr { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--kid-soft); font-weight: 700; font-size: .82rem; }
.mcard.done { box-shadow: inset 0 0 0 3px var(--good); }
.mind { padding: 10px 12px; border-radius: 14px; background: var(--surface-2); font-size: .95rem; }
.mind b { color: var(--kid); display: block; font-size: .75rem; letter-spacing: .07em; text-transform: uppercase; }
.count-big { font-family: var(--font-display); font-weight: 800; font-size: 4rem; line-height: 1; }

/* Rewards */
.balance { display: grid; justify-items: center; gap: 2px; padding: 18px; border-radius: 24px; background: var(--star-soft); text-align: center; }
.balance .bn { font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 1; }
.rw { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.rw .re { font-size: 2.2rem; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.rw .rt { flex: 1; min-width: 0; display: grid; gap: 4px; }
.rw .rn { font-weight: 700; font-family: var(--font-display); font-size: 1.12rem; line-height: 1.15; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--star); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: .8rem; background: var(--surface-2); }
.pill.wait { background: var(--star-soft); }
.pill.ok { background: var(--good-soft); color: var(--good); }

/* Week + month */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; padding: 10px 2px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); text-align: center; min-width: 0; }
.wd.today { box-shadow: inset 0 0 0 3px var(--kid); }
.wd .wn { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.wd .ws { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; line-height: 1; }
.wd .wf { font-size: 1.1rem; min-height: 1.4em; }
.wbar { width: 70%; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--good); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .ch { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: 4px 0; }
.cal .cd { aspect-ratio: 1; border-radius: 10px; display: grid; align-content: center; justify-items: center; font-size: .78rem; background: var(--surface-2); position: relative; min-width: 0; }
.cal .cd .cs { font-family: var(--font-display); font-weight: 800; font-size: .95rem; line-height: 1; }
.cal .cd.blank { background: transparent; }
.cal .cd.today { box-shadow: inset 0 0 0 2px var(--ink); }
.legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.stat { padding: 12px; border-radius: 16px; background: var(--surface-2); display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }

/* Parent */
.segs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.seg { flex: none; min-height: 42px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; }
.seg.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.kidrow { display: flex; align-items: center; gap: 12px; }
.kidrow .ava-m { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; font-size: 2rem; background: var(--kid-soft); flex: none; }
.kidrow .kt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.kidrow .kn { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 56px; }
.li:first-child { border-top: 0; }
.li .le { font-size: 1.6rem; width: 40px; text-align: center; flex: none; }
.li .lt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); font-size: 1rem; flex: none; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 700; font-size: .92rem; }
.input { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
textarea.input { min-height: 84px; resize: vertical; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { min-height: 44px; padding: 8px 14px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; text-align: left; }
.choice.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.choice small { display: block; font-weight: 400; opacity: .8; }
.emojis { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; max-height: 220px; overflow-y: auto; padding: 2px; }
.emo { height: 46px; border-radius: 12px; font-size: 1.5rem; display: grid; place-items: center; background: var(--surface-2); }
.emo.on { box-shadow: inset 0 0 0 3px var(--primary); background: var(--surface); }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day { width: 44px; height: 44px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; font-size: .85rem; }
.day.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors .sw { width: 44px; height: 44px; }
.req { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px; border-radius: 16px; background: var(--star-soft); }
.req .rq { flex: 1; min-width: 160px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.switch { width: 56px; height: 32px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch.on { background: var(--good); }
.switch.on::after { left: 28px; }
.daycards { display: grid; gap: 10px; }
.daycard { display: grid; gap: 6px; padding: 12px; border-radius: 16px; background: var(--surface-2); }
.daycard .dh { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; flex-wrap: wrap; }
.daycard .dl { display: flex; gap: 8px; flex-wrap: wrap; font-size: .88rem; }
.banner { padding: 10px 14px; border-radius: 14px; background: var(--hard-soft); color: var(--ink); font-size: .92rem; }
.loading { min-height: 70vh; display: grid; place-items: center; text-align: center; gap: 10px; align-content: center; }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--primary); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }

/* Mode tuning */
.m-little .step .lbl { font-size: 1.35rem; }
.m-little .pic { width: 68px; height: 68px; font-size: 2.5rem; }
.m-teen .sec-head, .m-adult .sec-head { background: var(--surface-2); }
.m-teen .tile, .m-adult .tile { border-top-width: 4px; }

@media (min-width: 720px) {
  h1 { font-size: 2.2rem; }
  .steps.two { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .breath::before { transform: scale(.8); }
}

/* Code display in profile form, month calendar fill */
.codeshow { display: flex; gap: 10px; justify-content: center; }
.codebox { width: 54px; height: 54px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; background: var(--surface-2); }
.cal .cd .fill { position: absolute; inset: 0; border-radius: 10px; background: var(--star); }
.cal .cd .dn, .cal .cd .cs { position: relative; }
.cal .cd .dn { color: var(--muted); font-size: .7rem; }

/* Fixes after phone testing */
.brand, .back, .timer-pill, .chip { white-space: nowrap; }
.brand-s { font-size: 1.25rem; }
.timer-pill { padding: 6px 10px; }
.who-chip { flex: 1 1 auto; }
.toast { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); }
.step { flex-wrap: wrap; }
.step .main { order: 1; }
.step .say { order: 2; }
.step .check { order: 3; }
.step .linkrow { order: 4; flex-basis: 100%; padding: 0 0 6px 68px; margin-top: -8px; }
.m-little .step .linkrow { padding-left: 80px; }
.breath { width: 200px; height: 200px; }
.breath-txt { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin-top: -6px; }
.toggle { width: 100%; text-align: left; }

/* ===== Update 2: clock, timer bubble, easy-read font ===== */
.clock { font-weight: 700; font-size: .92rem; padding: 6px 10px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); white-space: nowrap; flex: none; }
.tbub { position: fixed; z-index: 26; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow), 0 6px 20px rgba(0,0,0,.18); }
.tbub.over-tabs { bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); }
.tbub-ring { position: absolute; inset: 5px; border-radius: 50%; background: conic-gradient(var(--tc) calc(var(--p) * 1turn), var(--surface-2) 0); -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%); mask: radial-gradient(circle, transparent 60%, #000 61%); }
.tbub-t { position: relative; font-family: var(--font-display); font-weight: 800; font-size: .98rem; }
.font-easy { --font-body: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif; --font-display: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif; letter-spacing: .035em; word-spacing: .14em; }
.font-easy p, .font-easy .lbl, .font-easy .sub, .font-easy .small { line-height: 1.65; }
.font-easy h1, .font-easy h2, .font-easy h3 { letter-spacing: .01em; line-height: 1.25; font-weight: 700; }
.font-easy em, .font-easy i:not([class]) { font-style: normal; }

/* Celebration */
.overlay.celebrate { overflow: hidden; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; animation: fall linear infinite; }
@keyframes fall { 0% { transform: translateY(-20px) rotate(0) } 100% { transform: translateY(110vh) rotate(540deg) } }
.cele-msg { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.3; }
.sheet { position: relative; }

/* Devotional */
.devo { gap: 14px; }
.devo-head { display: flex; align-items: center; gap: 12px; }
.devo-e { font-size: 2.6rem; line-height: 1; }
.verse { margin: 0; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); border-left: 6px solid var(--kid); }
.verse p { font-size: 1.08rem; line-height: 1.55; }
.verse cite { display: block; margin-top: 6px; font-style: normal; font-weight: 700; font-size: .85rem; color: var(--muted); }
.devo-box { display: grid; gap: 4px; padding: 12px 14px; border-radius: 16px; background: var(--kid-soft); }
.devo-box.pray { background: var(--star-soft); }
.devo-kid { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.3; }

/* Feelings chart */
.levels { display: grid; gap: 10px; }
.lvl { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow), inset 8px 0 0 var(--lc); text-align: left; min-height: 84px; }
.lvl-e { font-size: 2.6rem; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--lc) 22%, transparent); flex: none; }
.lvl-t { display: grid; gap: 2px; min-width: 0; }
.lvl-t b { font-family: var(--font-display); font-size: 1.3rem; }
.lvl-card { box-shadow: var(--shadow), inset 0 8px 0 var(--lc); padding-top: 22px; }
.lvl-big { display: flex; align-items: center; gap: 14px; }
.lvl-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.mr-pill { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--kid-soft); font-weight: 700; }

/* Reports */
.fbars { display: grid; gap: 8px; }
.fbar { display: grid; grid-template-columns: minmax(0, 9.5em) 1fr 2.2em; gap: 10px; align-items: center; }
.fbar .fl { font-weight: 700; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbar .ft { height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.fbar .ft i { display: block; height: 100%; border-radius: 7px; }
.fbar b { text-align: right; }
.stat .small { line-height: 1.3; }
button.daycard { text-align: left; width: 100%; }
.cal button.cd:disabled { opacity: .5; }
.le.neg { color: var(--danger); font-weight: 800; font-size: 1.1rem; }
.le.pos { color: var(--good); font-weight: 800; font-size: 1.1rem; }
.selfans { display: grid; gap: 6px; }
.sa { display: grid; gap: 1px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.selfrec { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.selfrec:first-of-type { border-top: 0; }
textarea#rtext { min-height: 220px; font-size: .85rem; }

/* Self check-ins */
.ckcard.done { box-shadow: inset 0 0 0 2px var(--good); }
.ck-t { font-family: var(--font-display); font-size: 1.15rem; }
.sq { gap: 10px; }
.sq-h { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.opts3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.optg { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.opt { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; font-size: .9rem; text-align: center; min-height: 72px; align-content: center; }
.opt .oe { font-size: 1.9rem; line-height: 1; }
.opt.on { box-shadow: inset 0 0 0 3px var(--lc, var(--kid)); background: var(--kid-soft); }
.starrate { display: flex; gap: 6px; }
.sr { width: 52px; height: 52px; border-radius: 14px; font-size: 1.8rem; color: var(--line); box-shadow: inset 0 0 0 2px var(--line); }
.sr.on { color: var(--star); box-shadow: inset 0 0 0 2px var(--star); background: var(--star-soft); }
.prompt { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

/* Header fit on phones */
.top-in { gap: 8px; }
.top .back { padding: 0 12px 0 8px; }
.top .chip { padding: 6px 10px; }
.top .clock { padding: 6px 9px; font-size: .86rem; }
.font-easy .top { letter-spacing: normal; word-spacing: normal; --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; --font-body: "Atkinson Hyperlegible", system-ui, sans-serif; }
@media (max-width: 380px) { .who-chip .ava-s { display: none; } }

/* Timer buddy */
.dial.fun::before { background: conic-gradient(var(--tc) calc(var(--p) * 1turn), var(--surface-2) 0); }
.dial.fun { background: radial-gradient(circle at 30% 25%, var(--kid-soft), transparent 60%), var(--surface); }
.dial .orbit { position: absolute; inset: 0; z-index: 2; pointer-events: none; transform: rotate(calc(var(--p) * 1turn)); transition: transform .3s linear; }
.dial .orbit.trail { z-index: 1; }
.dial .orbit.t1 { transform: rotate(calc(var(--p) * 1turn + 9deg)); }
.dial .orbit.t2 { transform: rotate(calc(var(--p) * 1turn + 17deg)); }
.dial .orbit.t3 { transform: rotate(calc(var(--p) * 1turn + 25deg)); }
.dial .orbit.trail i { position: absolute; left: 50%; top: calc(11% + 9px); width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #FFD84D; box-shadow: 0 0 8px #FFD84D; }
.dial .orbit.t2 i { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; opacity: .75; }
.dial .orbit.t3 i { width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; opacity: .5; }
.dial .buddy { position: absolute; left: 50%; top: calc(11% + 9px); width: 0; height: 0; }
.dial .b-rot { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) rotate(calc(var(--p) * -1turn)); transition: transform .3s linear; }
.dial .b-bob { display: block; font-size: clamp(2.3rem, 12vw, 3.1rem); line-height: 1; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); animation: bob 1.1s ease-in-out infinite; }
.dial .b-bob.paused { animation: none; }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
.buddies { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bud { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); min-width: 0; }
.bud-e { font-size: 1.8rem; line-height: 1.1; }
.bud-n { font-size: .68rem; font-weight: 700; color: var(--muted); line-height: 1.1; text-align: center; }
.bud.on { box-shadow: inset 0 0 0 3px var(--kid); background: var(--kid-soft); }
.bud.on .bud-n { color: var(--ink); }
.bige.hop { animation: hop .7s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
.cele-phrase { font-size: 2rem; line-height: 1.15; }
@media (prefers-reduced-motion: reduce) { .dial .b-bob, .bige.hop { animation: none; } }

/* ===== Play: pet and world ===== */
.tab { font-size: .7rem; padding: 8px 0; }
.tab .ti { font-size: 1.35rem; }
.chip.coin { background: #FFF1C9; color: #5A4300; }
.playhead { display: grid; gap: 8px; }
.progress.thin { height: 8px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; }
.seg2 .choice { text-align: center; font-size: 1.02rem; min-height: 48px; }
.opts3.two { grid-template-columns: 1fr 1fr; }
.opt small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.opt:disabled { opacity: .45; }
.bubble { position: relative; justify-self: center; max-width: 92%; padding: 12px 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; text-align: center; display: flex; align-items: center; gap: 8px; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-top-color: var(--surface); border-bottom: 0; }
.petroom { position: relative; justify-self: center; width: min(100%, 340px); aspect-ratio: 1; border-radius: 32px; background: radial-gradient(circle at 50% 30%, var(--surface), var(--kid-soft) 75%), var(--surface-2); box-shadow: var(--shadow); overflow: hidden; }
.petroom .floor { position: absolute; left: 18%; right: 18%; bottom: 7%; height: 7%; border-radius: 50%; background: rgba(0,0,0,.12); }
.petroom canvas { position: absolute; inset: 4%; width: 92%; height: 92%; z-index: 1; animation: petbob 2.4s ease-in-out infinite; transform-origin: 50% 92%; cursor: pointer; }
@keyframes petbob { 0%, 100% { transform: scale(1, 1) } 50% { transform: scale(1.03, .97) } }
.petroom.jump canvas, .lcd.jump canvas { animation: petjump .8s ease-out; }
@keyframes petjump { 0% { transform: translateY(0) } 30% { transform: translateY(-22%) rotate(-8deg) } 55% { transform: translateY(0) } 75% { transform: translateY(-8%) rotate(6deg) } 100% { transform: translateY(0) } }
.tama { justify-self: center; width: min(100%, 300px); padding: 30px 28px 22px; border-radius: 50% 50% 46% 46% / 44% 44% 56% 56%; background: radial-gradient(circle at 35% 25%, color-mix(in srgb, var(--pc) 55%, #fff), var(--pc) 70%); box-shadow: inset 0 -8px 0 rgba(0,0,0,.12), var(--shadow); display: grid; gap: 14px; justify-items: center; }
.lcd { position: relative; width: 82%; aspect-ratio: 1; border-radius: 14px; background: #9FBF5A; box-shadow: inset 0 0 0 6px #6E7F55, inset 0 3px 10px rgba(0,0,0,.35); overflow: hidden; background-image: linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px); background-size: 6px 6px; }
.lcd canvas { position: absolute; inset: 10%; width: 80%; height: 80%; image-rendering: pixelated; image-rendering: crisp-edges; animation: pixhop 1.6s steps(2, end) infinite; cursor: pointer; }
@keyframes pixhop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4%) } }
.tama-btns { display: flex; gap: 18px; }
.tama-btns button { width: 52px; height: 52px; border-radius: 50%; background: #F6F2E8; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.2); font-size: 1.5rem; }
.tama-btns button:disabled { opacity: .5; }
.heart { position: absolute; bottom: 30%; z-index: 3; font-size: 1.8rem; pointer-events: none; animation: heartup 1.4s ease-out forwards; }
@keyframes heartup { 0% { transform: translateY(0) scale(.6); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(-160%) scale(1.2); opacity: 0 } }
.petname { display: flex; gap: 8px; align-items: baseline; justify-content: center; }
.petname b { font-family: var(--font-display); font-size: 1.5rem; }
.meters { display: grid; gap: 8px; }
.meter { display: grid; grid-template-columns: 6.5em 1fr; gap: 10px; align-items: center; font-weight: 700; font-size: .92rem; }
.meter .bar, .bar.big { height: 14px; border-radius: 7px; }
.meter .bar i { border-radius: 7px; transition: width .5s; }
.bar.big i { background: var(--star); }

@media (prefers-reduced-motion: reduce) { #splash .smark, #splash .sname, #splash .sname span, #splash .stag { animation: none !important; } }
/* Up next card on Today */
.upnext { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow), inset 0 -5px 0 var(--kid); }
.upnext .kring { width: 72px; height: 72px; } .upnext .kava { width: 60px; height: 60px; font-size: 2.1rem; }
.upnext .ut { display: grid; gap: 2px; min-width: 0; flex: 1; }
.upnext .ut b { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.1; }
.upnext .ut .time { justify-self: start; }
.upnext .go { flex: none; min-height: 52px; padding: 0 16px; border-radius: 16px; background: var(--kid); color: #fff; font-weight: 800; }

.tray .optg { max-height: 46vh; overflow-y: auto; padding: 2px; }

.catchbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #FFF3C4; border: 2px solid #E9A300; color: #4A3500; border-radius: 14px; padding: 8px 12px; margin: 0 0 10px; }
.catchbar .btn { min-height: 36px; padding: 4px 12px; }
.catchlinkrow { display: flex; justify-content: flex-end; margin: -4px 0 8px; }
.catchlink { background: none; border: 0; color: var(--muted, #5b6478); font: inherit; font-size: .85rem; text-decoration: underline; padding: 6px; cursor: pointer; }
.catchrow { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; font: inherit; color: inherit; }

.wxcard { padding: 12px 14px; }
.wxhead { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.wxcard > .wxhead { cursor: default; }
.wxbig { font-size: 2.4rem; line-height: 1; }
.wxt { flex: 1; min-width: 0; }
.wxcaret { color: var(--muted, #5b6478); }
.wxq { font-weight: 700; margin: 12px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wxgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wxitem { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px 8px; min-height: 96px; border-radius: 16px; border: 2px solid rgba(100,110,140,.25); background: rgba(255,255,255,.7); font: inherit; color: inherit; cursor: pointer; }
.wxe { font-size: 2.3rem; line-height: 1.1; }
.wxn { font-size: .82rem; font-weight: 700; text-align: center; line-height: 1.15; }
.wxok { position: absolute; top: 4px; right: 6px; display: none; width: 22px; height: 22px; border-radius: 50%; background: #24874F; color: #fff; font-size: .8rem; align-items: center; justify-content: center; }
.wxitem.got { border-color: #24874F; background: rgba(36,135,79,.12); }
.wxitem.got .wxok { display: flex; }
.wxready { text-align: center; font-weight: 800; color: #1c6b3e; margin: 10px 0 0; }
.wxhint { margin: 8px 0 0; }
.wxmore { margin-top: 10px; } .wxmore summary { cursor: pointer; font-size: .85rem; color: var(--muted, #5b6478); }
.wxchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.wxchip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 2px solid rgba(100,110,140,.3); background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
.wxchip.on { border-color: #2563D9; background: #E7EEFF; }

.drawer { padding: 0; overflow: hidden; }
.dbar { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.dbar .small { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dicons { font-size: 1.4rem; }
.dlist { border-top: 1px solid rgba(100,110,140,.2); }
.ditem + .ditem { border-top: 1px solid rgba(100,110,140,.15); }
.drow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.de { font-size: 1.9rem; } .dn { flex: 1; min-width: 0; }
.ditem.on { background: rgba(37,99,217,.05); }
.dbody { padding: 0 14px 14px; }
/* Pixel pictures */
img.px { width: 1.15em; height: 1.15em; vertical-align: -0.22em; display: inline-block; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; -webkit-user-drag: none; user-select: none; }
.heart img.px, .burst img.px { width: 1.2em; height: 1.2em; }
/* Profiles card */
.prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.prow:first-of-type { border-top: 0; }
.prow .pn { flex: 1; min-width: 120px; }

/* Day tags: no school / weekend */
.daytag { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--good-soft); color: var(--ink); }
.daytag.wk { background: var(--star-soft); }
.daytag .dte { font-size: 2rem; line-height: 1; }
.linkrow .tmr.on { background: var(--kid); color: #fff; }
.linkrow { display: flex; flex-wrap: wrap; gap: 6px; }

/* Pop-up reminder (kid screen) */
.nudge { position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); width: min(calc(100% - 24px), 520px); background: var(--surface); color: var(--ink); border-radius: 22px; box-shadow: 0 12px 34px rgba(10, 14, 24, .32), inset 0 0 0 3px var(--kid); padding: 14px; display: grid; gap: 10px; animation: ndrop .35s ease-out; }
@keyframes ndrop { from { transform: translate(-50%, -24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.nhead { display: flex; align-items: center; gap: 8px; }
.nhead .small { margin-left: auto; }
.nbell { font-size: 1.4rem; display: inline-block; transform-origin: 50% 10%; animation: nring 1.2s ease-in-out 2; }
@keyframes nring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(16deg); } 30% { transform: rotate(-14deg); } 45% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } 75% { transform: rotate(2deg); } }
.nbody { display: flex; align-items: center; gap: 12px; }
.ntext { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; line-height: 1.15; overflow-wrap: anywhere; }
.nacts { display: flex; gap: 8px; flex-wrap: wrap; }
.nacts .btn { flex: 1 1 auto; min-height: 48px; }
/* Reminder list (start screen) */
.nlist { display: grid; gap: 8px; }
.nrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow), inset 5px 0 0 var(--kid); }
.nrow .nt { flex: 1; display: grid; gap: 2px; min-width: 0; }
.nrow .nt b { font-size: 1rem; line-height: 1.2; }
.nrow .kgo { font-size: 1.6rem; color: var(--muted); }

/* No-school day picker */
.offstrip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.offday { display: grid; justify-items: center; gap: 0; padding: 6px 2px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; min-height: 62px; }
.offday small { font-size: .7rem; color: var(--muted); font-weight: 700; line-height: 1.2; }
.offday b { font-size: 1.1rem; line-height: 1.2; }
.offday.today { box-shadow: inset 0 0 0 2px var(--primary); }
.offday.on { background: var(--good); color: #fff; box-shadow: none; }
.offday.on small { color: #fff; }
.offday.sel { outline: 3px solid var(--primary); outline-offset: 2px; }
.offday:disabled { opacity: .35; cursor: default; }
.offed { padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.card.dim { opacity: .62; }

/* Brushing guide */
.tguide { display: grid; justify-items: center; gap: 6px; width: 100%; }
.mouth { width: min(72vw, 260px); height: auto; }
.mouth .gum { fill: #F7A8B8; opacity: .55; }
.mouth .tongue { fill: #F27B95; opacity: .6; }
.mouth .tooth { fill: #FFFFFF; stroke: #B9C2D3; stroke-width: 2; transition: fill .3s, stroke .3s; }
.mouth .tooth.did { fill: #DDF3E6; stroke: #5BB884; }
.mouth .tooth.on { fill: var(--kid); stroke: var(--kid); animation: tglow 1s ease-in-out infinite; }
@keyframes tglow { 50% { opacity: .6; } }
.tzone { text-align: center; font-family: var(--font-display); font-size: 1.3rem; line-height: 1.2; }
.tdots { display: flex; gap: 8px; }
.tdots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.tdots i.on { background: var(--kid); }
.tdots i.done { background: var(--good); }

/* Picture step guides (teeth, bath, shower) */
.hq { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; margin: 4px 0 8px; width: 100%; text-align: left; }
.hsteps { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; width: 100%; }
.hstep { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 4px 8px; min-height: 96px; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line); background: var(--surface); }
.hstep .he { font-size: 2rem; line-height: 1.1; }
.hstep .hn { font-size: .82rem; font-weight: 700; text-align: center; line-height: 1.15; }
.hstep .hno { position: absolute; top: 4px; left: 8px; font-size: .72rem; font-weight: 800; color: var(--muted); }
.hstep.got { box-shadow: inset 0 0 0 3px var(--good); background: var(--good-soft); }
.hstep.got::after { content: "✓"; position: absolute; top: 4px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #fff; font-size: .8rem; display: grid; place-items: center; }
.hdone { text-align: center; font-weight: 800; color: var(--good); margin: 10px 0 0; }


/* ===== Backup, privacy, language, reminders ===== */
.restorebox, .dangerbox, .pushbox { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: var(--surface-2); }
.dangerbox { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--danger) 35%, transparent); background: transparent; }
.privacy { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: .92rem; gap: 6px; }
.privacy h4 { margin: 8px 0 0; font-size: .95rem; }
.privacy p { margin: 0; }
.linkbtn { font-weight: 700; text-decoration: underline; color: inherit; padding: 0 2px; }
.check-row { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); font-size: .95rem; width: 100%; }
.check-row.on { box-shadow: inset 0 0 0 2px var(--good); background: var(--good-soft); }
.cbox { width: 26px; height: 26px; border-radius: 8px; flex: none; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--muted); font-weight: 800; color: #fff; }
.check-row.on .cbox { background: var(--good); box-shadow: none; }
.btn[aria-disabled="true"] { opacity: .55; }
.cbtn.slim { min-width: 64px; min-height: 56px; padding: 6px 8px; flex: none; }
.remkid { display: grid; gap: 4px; padding-top: 6px; }
.remrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding: 4px 0; }
.toggle.slim { min-height: 48px; }
a.mini { display: inline-flex; align-items: center; text-decoration: none; font-size: .78rem; }

/* ===== Moments ===== */
.momkinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.momkind { display: grid; justify-items: center; gap: 4px; padding: 14px 8px; border-radius: 18px; font-weight: 800; font-family: var(--font-display); font-size: 1.02rem; box-shadow: inset 0 0 0 2px var(--line); background: var(--surface); }
.momkind span { font-size: 2rem; line-height: 1; }
.momkind.tough.on, .momkind.tough:hover { background: var(--rough-soft); box-shadow: inset 0 0 0 3px var(--rough); }
.momkind.great.on, .momkind.great:hover { background: var(--star-soft); box-shadow: inset 0 0 0 3px var(--star); }
.tagchips { display: flex; flex-wrap: wrap; gap: 8px; }
.tagchip { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 6px 12px; border-radius: 999px; box-shadow: inset 0 0 0 2px var(--line); font-weight: 700; font-size: .9rem; background: var(--surface); }
.tagchip span { font-size: 1.15rem; line-height: 1; }
.tagchip.on { background: var(--kid-soft); box-shadow: inset 0 0 0 2px var(--kid); }
.insight { padding: 10px 12px; border-radius: 12px; background: var(--rough-soft); margin: 0; }
.momrow .le { font-size: 1.4rem; }
.momrow.great .le { filter: none; }

/* ===== Learn ===== */
.lacts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.lact { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: 128px; padding: 14px 8px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 2px var(--kid-soft); text-align: center; font-family: var(--font-display); font-size: 1.15rem; }
.lact .oe { font-size: 2.6rem; line-height: 1; }
.lact small { font-family: var(--font-body); font-size: .8rem; color: var(--muted); font-weight: 600; }
.lrn { display: grid; gap: 14px; }
.lrn-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lrn-prog { font-weight: 700; color: var(--muted); font-size: .9rem; }
.lrn-bar { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.lrn-bar i { display: block; height: 100%; background: var(--kid); border-radius: 6px; transition: width .3s; }
.lrn-q { display: grid; justify-items: center; gap: 10px; padding: 18px 12px; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.say.big { width: 64px; height: 64px; font-size: 1.8rem; background: var(--kid-soft); }
.lrn-say { margin: 0; font-weight: 700; color: var(--muted); }
.lbig { font-family: var(--font-display); font-size: 5.5rem; line-height: 1; font-weight: 800; color: var(--kid); }
.lpic { font-size: 6rem; line-height: 1; }
.lcount { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 300px; font-size: 2.5rem; line-height: 1; }
.lrn-choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.lrn-choices.n3 { grid-template-columns: repeat(3, 1fr); }
.lrn-choices.words { grid-template-columns: 1fr; }
.lchoice { min-height: 84px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 3px var(--line); font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; text-transform: none; }
.lchoice.big { font-size: 3rem; min-height: 104px; }
.lrn-choices.words .lchoice { font-size: 2rem; min-height: 72px; font-family: var(--font-body); }
.lchoice.right { background: var(--good-soft); box-shadow: inset 0 0 0 4px var(--good); }
.lchoice.wrong { background: var(--hard-soft); box-shadow: inset 0 0 0 4px var(--hard); animation: shake .35s; }
.lchoice.hint { animation: hop .7s ease-in-out infinite; }
.lrn-word { text-align: center; font-family: var(--font-display); font-size: 2rem; margin: 0; }
.lrn-word b { color: var(--kid); }
.slots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.slot { width: 44px; height: 56px; border-radius: 12px; box-shadow: inset 0 -4px 0 var(--line), inset 0 0 0 2px var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 2rem; font-weight: 800; background: var(--surface); }
.slot.on { box-shadow: inset 0 -4px 0 var(--kid), inset 0 0 0 2px var(--kid); color: var(--kid); }
.slots.done .slot { background: var(--good-soft); box-shadow: inset 0 0 0 2px var(--good); color: var(--good); }
.tiles { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.tile { width: 58px; height: 64px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow), inset 0 -5px 0 var(--kid-soft), inset 0 0 0 2px var(--kid-soft); font-family: var(--font-display); font-weight: 800; font-size: 2rem; }
.tile.used { opacity: .25; box-shadow: none; }
.tile.wrong { animation: shake .35s; background: var(--hard-soft); }
.tile.hint { animation: hop .7s ease-in-out infinite; box-shadow: inset 0 0 0 3px var(--star); }
.fact { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1.1; }
.fact .entry { display: inline-block; min-width: 1.6em; padding: 0 .2em; border-radius: 12px; background: var(--surface-2); color: var(--kid); }
.fact .entry.wrong { background: var(--hard-soft); color: var(--hard); animation: shake .35s; }
.fact .entry.right { background: var(--good-soft); color: var(--good); }
.lpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; width: 100%; justify-self: center; }
.lkey { min-height: 64px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; }
.lkey.go { background: var(--kid); color: #fff; }
.lrn-done h1 { margin: 0; }
.lrn-done .bige, .fact-done .bige { font-size: 4.4rem; line-height: 1; }
.lact.wide { grid-template-columns: auto 1fr; justify-items: start; text-align: left; min-height: 0; gap: 14px; padding: 14px 18px; width: 100%; margin: 0; }
.lact.wide .fl { display: grid; gap: 2px; }
.factsbtn { background: var(--star-soft); }
.ftopics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ftopic { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 2px var(--kid-soft); font-family: var(--font-display); font-size: 1.05rem; text-align: center; }
.ftopic .oe { font-size: 2.3rem; line-height: 1; }
.ftopic.fav { box-shadow: var(--shadow), inset 0 0 0 3px var(--star); }
.ftopic small { font-family: var(--font-body); font-size: .78rem; color: var(--muted); font-weight: 700; }
.fbar2 { width: 70%; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.fbar2 i { display: block; height: 100%; background: var(--good); }
.factcard { display: grid; gap: 10px; padding: 20px 18px; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow); }
.fact-head { display: flex; align-items: center; gap: 10px; }
.fact-head .oe { font-size: 2.6rem; line-height: 1; }
.fact-topic { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--kid); }
.fact-kicker { margin: 4px 0 0; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-size: .8rem; }
.fact-text { margin: 0; font-size: 1.35rem; line-height: 1.45; font-weight: 600; }
.fact-text.big { font-size: 1.5rem; }
.fact-all { margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--good-soft); font-weight: 700; }
.fact-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
.ftool { display: grid; justify-items: center; gap: 2px; min-height: 64px; padding: 8px 4px; border-radius: 16px; background: var(--surface-2); font-weight: 700; font-size: .85rem; }
.ftool img.px { width: 1.6rem; height: 1.6rem; }
.ftool:not(.on)[aria-pressed] img.px { filter: grayscale(1); opacity: .55; }
.ftool.on { background: var(--star-soft); box-shadow: inset 0 0 0 2px var(--star); }
.fact-done .ftopics { width: 100%; }
.ftoggles .choice { min-height: 40px; }
.factlist { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.factlist li { padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.chip.pts { background: var(--star-soft); color: var(--ink); font-weight: 800; }
.chip.pts.pop { animation: ptspop .5s ease-out; }
@keyframes ptspop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
.ptsbanner { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 18px; background: var(--star-soft); font-weight: 700; }
.ptsbanner b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }
.ptsline { margin: 0; font-weight: 800; }
.lvlrow { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: .95rem; }
.pdots { display: inline-flex; gap: 5px; }
.pdots i { width: 14px; height: 14px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line); }
.pdots i.on { background: var(--good); box-shadow: none; }
.lvlup { padding: 12px 14px; border-radius: 18px; background: var(--good-soft); font-weight: 600; }
.lvlup b { color: var(--good); }
.sets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.setbox { position: relative; display: grid; place-items: center; min-height: 170px; padding: 14px 8px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 3px var(--kid-soft); }
.setbox.right { box-shadow: var(--shadow), inset 0 0 0 4px var(--good); background: var(--good-soft); }
.setbox.wrong { box-shadow: var(--shadow), inset 0 0 0 4px var(--hard); animation: shake .35s; }
.setpics { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px; max-width: 150px; font-size: 1.4rem; line-height: 1; }
.setn { position: absolute; top: 6px; right: 10px; font-family: var(--font-display); font-size: 1.4rem; }
.lrn-say.big { font-size: 1.25rem; font-weight: 700; }
.lrn-choices.pics .lchoice { width: 100%; padding: 8px 0; font-size: 3.6rem; min-height: 112px; line-height: 1; }
.lpic.sm { font-size: 4.5rem; }

/* ============================== Boot ============================== */
const app = document.getElementById('app');
let slowTimer = null;

async function boot() {
  render();
  /* Demo website: saved only in this browser. Never connects to Claude. */
  S.downloads = null;
  S.store = new LocalStore();
  S.assets = null;
  slowTimer = setTimeout(() => { S.slow = true; render(); }, 10000);
  const fail = e => { clearTimeout(slowTimer); S.error = (e && e.code) || 'error'; render(); };
  S.store.watchDoc('app/settings', (data, meta) => {
    S.settings = data ? clone(data) : null;
    if (!(meta && meta.fromCache) || data) { S.settingsLoaded = true; clearTimeout(slowTimer); S.slow = false; }
    if (S.settingsLoaded && S.phase === 'loading') {
      S.phase = 'ready';
      UI.view = S.settings && S.settings.setupDone ? 'who' : 'setup';
      if (UI.view === 'setup') UI.setup = { step: 0, pin1: [], pin2: [], child: null, added: [] };
    }
    if (S.settings && S.settings.setupDone && UI.view === 'setup' && !(UI.setup && UI.setup.finishing)) UI.view = 'who';
    scheduleRender();
  }, fail);
  S.store.watchColl('charts', docs => { S.charts = {}; for (const d of docs) S.charts[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('months', docs => { S.months = {}; for (const d of docs) S.months[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('redeems', docs => { S.redeems = {}; for (const d of docs) S.redeems[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('weeks', docs => { S.weeks = {}; for (const d of docs) S.weeks[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('adjust', docs => { S.adjusts = {}; for (const d of docs) S.adjusts[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('selfchecks', docs => { S.selfchecks = {}; for (const d of docs) S.selfchecks[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('play', docs => { for (const d of docs) if (!playTimers[d.id]) S.plays[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('moments', docs => { S.moments = {}; for (const d of docs) S.moments[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('learn', docs => { for (const d of docs) if (!(UI.lrn && UI.childId === d.id)) S.learns[d.id] = clone(d.data); scheduleRender(); }, fail);
  S.store.watchColl('voices', docs => { S.voices = {}; for (const d of docs) S.voices[d.id] = clone(d.data); prefetchVoices(); scheduleRender(); }, fail);

}
document.addEventListener('focusout', () => { if (renderWhenIdle) setTimeout(() => { if (!isTyping() && renderWhenIdle) { renderWhenIdle = false; render(); } }, 50); });

async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise((res, rej) => cv.toBlob(b => (b ? res(b) : rej(new Error('encode'))), 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}

let WX = null, wxBusy = false, wxFailAt = 0, WXLOC = null;
const WX_MANUAL = [

function wxIcon(code, hi) {

  if (code >= 51 && code <= 67 || code >= 80 && code <= 82) return '🌧️'; if (code === 45 || code === 48) return '🌫️';
  if (code === 0) return hi >= 80 ? '☀️' : '🌞'; if (code <= 2) return '🌤️'; return '☁️';
}
function wxScene(w) {
  const hi = w.hi, snow = !!w.snow, rain = !snow && !!w.rain;
  const t = hi >= 80 ? 'hot' : hi >= 65 ? 'warm' : hi >= 50 ? 'cool' : hi >= 35 ? 'cold' : 'freezing';

}
function wxOutfit(sc) {

  const t = sc.t;
  if (t === 'hot') { add('👕', 'T-shirt'); add('🩳', 'Shorts'); add('👗', 'Sundress or skirt'); }
  else if (t === 'warm') { add('👕', 'T-shirt'); add('🩳', 'Shorts or pants', 'Shorts or pants'); }
  else if (t === 'cool') { add('👕', 'Long-sleeve shirt'); add('👖', 'Pants'); add('🧥', 'Light jacket'); }
  else if (t === 'cold') { add('👕', 'Long-sleeve shirt'); add('👖', 'Pants'); add('🧥', 'Warm coat'); add('🧢', 'Hat'); add('🧤', 'Gloves'); }
  else { add('👖', 'Warm pants'); add('🧥', 'Heavy coat'); add('🧢', 'Warm hat'); add('🧣', 'Scarf'); add('🧤', 'Gloves'); add('🧦', 'Warm socks'); }
  if (sc.snow) { add('🥾', 'Snow boots'); add('🧤', 'Gloves'); add('🧢', 'Warm hat'); if (t === 'cool' || t === 'warm' || t === 'hot') add('🧥', 'Warm coat'); }
  else if (sc.rain) { add('☂️', 'Umbrella'); add('🧥', 'Rain jacket'); add('🥾', 'Rain boots'); }
  else if (t === 'hot') add('🩴', 'Sandals or sneakers', 'Sandals or sneakers'); else if (t !== 'freezing') add('👟', 'Sneakers');
  if (t === 'freezing' && !sc.snow) add('🥾', 'Warm boots');

}

function geoOnce() {

async function jget(url) {

  try { const r = await fetch(url, { signal: ac.signal }); if (!r.ok) throw new Error('http ' + r.status); return await r.json(); } finally { clearTimeout(tm); }

function wxRefresh() { if (UI.view === 'child' && UI.tab === 'today' || UI.view === 'parent') { UI._keepScroll = true; render(); } }
async function wxFetch() {

    const key = lat.toFixed(2) + ',' + lon.toFixed(2) + ',' + todayStr();
    if (WX && WX.key === key && Date.now() - WX.at < 30 * 60000) return;
    const j = await jget(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=1`);
