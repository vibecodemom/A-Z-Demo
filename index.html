    ['Harriet Tubman bravely led many enslaved people to freedom on the Underground Railroad, a secret path of safe houses.', 'Harriet Tubman guió con valentía a muchas personas esclavizadas hacia la libertad por el Ferrocarril Subterráneo, un camino secreto de casas seguras.'],
    ['In 1955, Rosa Parks would not give up her bus seat in Montgomery, Alabama. That helped start a big push for fair rules.', 'En 1955, Rosa Parks no quiso ceder su asiento en un autobús en Montgomery, Alabama. Eso ayudó a empezar una gran lucha por reglas justas.'],
    ['Ruby Bridges was 6 years old in 1960 when she became the first Black child at her school in New Orleans, which had only allowed white children before.', 'Ruby Bridges tenía 6 años en 1960 cuando fue la primera niña negra en su escuela de Nueva Orleans, que antes solo aceptaba niños blancos.'],
    ['Dr. Martin Luther King Jr. gave his famous "I Have a Dream" speech in Washington, D.C., in 1963.', 'El Dr. Martin Luther King Jr. dio su famoso discurso "Yo tengo un sueño" en Washington, D.C., en 1963.'],
    ['In 1947, Jackie Robinson became the first Black player in modern Major League Baseball. Every April 15, all players wear his number, 42.', 'En 1947, Jackie Robinson fue el primer jugador negro de las Grandes Ligas de béisbol modernas. Cada 15 de abril, todos los jugadores usan su número, el 42.'],
    ['Katherine Johnson was a NASA math expert. Astronaut John Glenn asked for her to check the computer\'s math before his trip around Earth.', 'Katherine Johnson era experta en matemáticas en la NASA. El astronauta John Glenn pidió que ella revisara los cálculos de la computadora antes de su viaje alrededor de la Tierra.'],
    ['In 1992, Mae Jemison became the first Black woman to go to space.', 'En 1992, Mae Jemison fue la primera mujer negra en ir al espacio.'],
    ['Garrett Morgan invented a traffic signal in 1923 with an extra position that made crossing streets safer, plus a hood that helped firefighters breathe in smoke.', 'Garrett Morgan inventó en 1923 un semáforo con una posición extra que hacía más seguro cruzar las calles, y también una capucha que ayudaba a los bomberos a respirar entre el humo.'],
    ['George Washington Carver found hundreds of ways to use peanuts and sweet potatoes. He did not invent peanut butter, even though many people think so!', 'George Washington Carver encontró cientos de usos para el cacahuate y el camote. ¡No inventó la crema de cacahuate, aunque mucha gente lo cree!'],
    ['Madam C.J. Walker made hair care products and became one of the first American women to become a millionaire by starting her own business.', 'Madam C.J. Walker hizo productos para el cabello y fue una de las primeras mujeres de Estados Unidos en hacerse millonaria con su propio negocio.'],
    ['In 2009, Barack Obama became the first Black president of the United States.', 'En 2009, Barack Obama fue el primer presidente negro de Estados Unidos.'],
    ['Simone Biles has won more world and Olympic medals than any other gymnast in history.', 'Simone Biles ha ganado más medallas mundiales y olímpicas que cualquier otra gimnasta de la historia.']
  ] },
  { id: 'water', e: '💧', n: ['Water', 'El agua'], f: [
    ['About 71 out of every 100 parts of Earth\'s surface is covered with water.', 'Unas 71 de cada 100 partes de la superficie de la Tierra están cubiertas de agua.'],
    ['Only about 3 out of every 100 drops of Earth\'s water is fresh water. Most of that is frozen in ice.', 'Solo unas 3 de cada 100 gotas de agua de la Tierra son agua dulce. Casi toda está congelada en el hielo.'],
    ['The water cycle: the Sun warms water so it rises into the air, it makes clouds, and it falls back down as rain or snow. Then it starts again!', 'El ciclo del agua: el Sol calienta el agua y sube al aire, forma nubes y vuelve a caer como lluvia o nieve. ¡Y vuelve a empezar!'],
    ['The water you drink might once have been drunk by a dinosaur! Earth keeps using the same water over and over.', '¡El agua que tomas pudo haberla tomado un dinosaurio! La Tierra usa la misma agua una y otra vez.'],
    ['A water treatment plant cleans water by letting dirt sink, filtering it, and adding a tiny bit of chlorine to kill germs.', 'Una planta potabilizadora limpia el agua dejando que la tierra se hunda, filtrándola y poniéndole un poquito de cloro para matar los gérmenes.'],
    ['Water towers are tall so gravity can push water down through pipes and out of your faucet.', 'Los tanques de agua son altos para que la gravedad empuje el agua por los tubos hasta tu llave.'],
    ['Water that goes down the drain travels to a treatment plant to be cleaned before it goes back to a river.', 'El agua que se va por el desagüe viaja a una planta de tratamiento para limpiarla antes de regresar a un río.'],
    ['Long ago, the Romans built aqueducts, long stone bridges and channels that carried water to cities. Some are still standing!', 'Hace mucho tiempo, los romanos construyeron acueductos, largos puentes y canales de piedra que llevaban agua a las ciudades. ¡Algunos siguen en pie!'],
    ['Your body is about 60 percent water.', 'Tu cuerpo es más o menos 60 por ciento agua.'],
    ['Ice floats because water spreads out and gets lighter when it freezes.', 'El hielo flota porque el agua se expande y se vuelve más ligera cuando se congela.'],
    ['The Amazon River in South America carries more water than any other river on Earth.', 'El río Amazonas, en América del Sur, lleva más agua que cualquier otro río de la Tierra.'],
    ['Turning off the water while you brush your teeth can save gallons of water every day.', 'Cerrar la llave mientras te cepillas los dientes puede ahorrar muchos litros de agua cada día.']
  ] },
  { id: 'weather', e: '⛅', n: ['Weather', 'El clima'], f: [
    ['Lightning is about five times hotter than the surface of the Sun.', 'Un rayo es como cinco veces más caliente que la superficie del Sol.'],
    ['Thunder is the sound lightning makes when it heats the air so fast that the air goes BOOM.', 'El trueno es el sonido que hace el rayo cuando calienta el aire tan rápido que el aire hace ¡BUM!'],
    ['Count the seconds between a lightning flash and the thunder, then divide by 5. That is about how many miles away the storm is.', 'Cuenta los segundos entre el relámpago y el trueno y divídelos entre 3. Así sabes más o menos a cuántos kilómetros está la tormenta.'],
    ['A fluffy cumulus cloud can weigh about 1.1 million pounds, but its water drops are so tiny that they float.', 'Una nube esponjosa puede pesar unos 500,000 kilos, pero sus gotitas son tan pequeñas que flotan.'],
    ['Snowflakes almost always have six sides or six points.', 'Los copos de nieve casi siempre tienen seis lados o seis puntas.'],
    ['To see a rainbow, the Sun has to be behind you and the rain in front of you.', 'Para ver un arcoíris, el Sol tiene que estar detrás de ti y la lluvia enfrente.'],
    ['The strongest tornadoes can spin faster than 200 miles per hour.', 'Los tornados más fuertes pueden girar a más de 320 kilómetros por hora.'],
    ['Hurricanes form over warm ocean water. Weather experts give each one a name from a list.', 'Los huracanes se forman sobre el agua tibia del mar. Los expertos del clima le ponen a cada uno un nombre de una lista.'],
    ['Fog is a cloud that is touching the ground.', 'La neblina es una nube que toca el suelo.'],
    ['Some hailstones grow as big as softballs!', '¡Algunas piedras de granizo crecen tan grandes como una pelota de softbol!'],
    ['The coldest temperature ever measured on Earth was minus 128.6 degrees Fahrenheit, in Antarctica in 1983.', 'La temperatura más fría medida en la Tierra fue de 89.2 grados bajo cero, en la Antártida en 1983.'],
    ['Scientists who study and predict the weather are called meteorologists.', 'Los científicos que estudian y predicen el clima se llaman meteorólogos.']
  ] },
  { id: 'candy', e: '🍭', n: ['Candy', 'Dulces'], f: [
    ['Cotton candy machines were invented in 1897 by a dentist, William Morrison, and a candy maker, John C. Wharton. They called it "Fairy Floss."', 'La máquina de algodón de azúcar la inventaron en 1897 un dentista, William Morrison, y un dulcero, John C. Wharton. Lo llamaron "Fairy Floss", o "hilo de hada".'],
    ['Cotton candy became famous at the 1904 World\'s Fair in St. Louis.', 'El algodón de azúcar se hizo famoso en la Feria Mundial de 1904 en San Luis.'],
    ['Chocolate comes from cacao beans that grow in big pods on cacao trees. The beans are dried, roasted and ground up.', 'El chocolate viene de granos de cacao que crecen en vainas grandes en los árboles de cacao. Los granos se secan, se tuestan y se muelen.'],
    ['Milton Hershey started making Hershey\'s Kisses in 1907.', 'Milton Hershey empezó a hacer los Kisses de Hershey en 1907.'],
    ['M&M\'s were first made in 1941. Their candy shell kept the chocolate from melting, so soldiers could carry them.', 'Los M&M\'s se hicieron por primera vez en 1941. Su capa de dulce evitaba que el chocolate se derritiera, así los soldados podían llevarlos.'],
    ['Gummy bears were invented in Germany in 1922 by Hans Riegel, who started the company Haribo.', 'Los ositos de goma se inventaron en Alemania en 1922. Los creó Hans Riegel, que fundó la compañía Haribo.'],
    ['Reese\'s Peanut Butter Cups were invented in 1928 by H.B. Reese, who used to work for Milton Hershey.', 'Las Reese\'s Peanut Butter Cups las inventó en 1928 H.B. Reese, que antes trabajaba para Milton Hershey.'],
    ['PEZ candy was invented in Austria in 1927 as a peppermint. Its name comes from the German word for peppermint, "Pfefferminz."', 'Los dulces PEZ se inventaron en Austria en 1927 como pastillas de menta. Su nombre viene de la palabra alemana para menta, "Pfefferminz".'],
    ['Leo Hirshfield named the Tootsie Roll after his daughter, whose nickname was Tootsie.', 'Leo Hirshfield le puso Tootsie Roll a su dulce por su hija, a quien le decían Tootsie.'],
    ['The Snickers candy bar was named after a horse that the Mars family loved.', 'La barra Snickers se llamó así por un caballo que la familia Mars quería mucho.'],
    ['Hard candy is made by boiling sugar and water until it gets super hot, about 300 degrees Fahrenheit, then letting it cool.', 'Los caramelos duros se hacen hirviendo agua con azúcar hasta que está muy caliente, unos 150 grados Celsius, y luego se deja enfriar.'],
    ['Pop Rocks pop because tiny bubbles of gas are trapped inside the candy. Your spit melts the candy and lets them out!', 'Los Pop Rocks truenan porque tienen burbujitas de gas atrapadas adentro. ¡Tu saliva derrite el dulce y las deja salir!'],
    ['Jelly beans can take a week or more to make, because each layer of sugar coating needs time to dry.', 'Las gomitas de frijol pueden tardar una semana o más en hacerse, porque cada capa de azúcar necesita tiempo para secarse.']
  ] },
  { id: 'space', e: '🚀', n: ['Space', 'El espacio'], f: [
    ['The Sun is a star. Its light takes about 8 minutes to reach Earth.', 'El Sol es una estrella. Su luz tarda unos 8 minutos en llegar a la Tierra.'],
    ['About 1.3 million Earths could fit inside the Sun.', 'Dentro del Sol cabrían como 1.3 millones de Tierras.'],
    ['A day on Venus is longer than a whole year on Venus!', '¡Un día en Venus dura más que un año entero en Venus!'],
    ['Jupiter is the biggest planet. Its Great Red Spot is a storm bigger than Earth.', 'Júpiter es el planeta más grande. Su Gran Mancha Roja es una tormenta más grande que la Tierra.'],
    ['Mars looks red because its dirt has rusty iron in it.', 'Marte se ve rojo porque su tierra tiene hierro oxidado.'],
    ['Olympus Mons on Mars is the tallest volcano we know of. It is about two and a half times as tall as Mount Everest.', 'El Monte Olimpo en Marte es el volcán más alto que conocemos. Es como dos veces y media más alto que el Monte Everest.'],
    ['Saturn\'s rings are made of chunks of ice and rock.', 'Los anillos de Saturno están hechos de pedazos de hielo y roca.'],
    ['In 1969, Neil Armstrong became the first person to walk on the Moon. There is no wind there, so footprints can last a very long time.', 'En 1969, Neil Armstrong fue la primera persona en caminar en la Luna. Allá no hay viento, así que las huellas pueden durar muchísimo tiempo.'],
    ['Astronauts on the International Space Station see about 16 sunrises every day.', 'Los astronautas en la Estación Espacial Internacional ven como 16 amaneceres cada día.'],
    ['Astronauts get a little taller in space because their backbones stretch out without gravity pulling them down.', 'Los astronautas crecen un poquito en el espacio porque su columna se estira sin la gravedad que la jala hacia abajo.'],
    ['Space is silent. There is no air to carry sound.', 'El espacio es silencioso. No hay aire que lleve el sonido.'],
    ['Pluto was called a planet until 2006. Now it is called a dwarf planet.', 'A Plutón le decían planeta hasta 2006. Ahora es un planeta enano.'],
    ['Our galaxy is called the Milky Way. It has hundreds of billions of stars.', 'Nuestra galaxia se llama la Vía Láctea. Tiene cientos de miles de millones de estrellas.']
  ] },
  { id: 'crayons', e: '🖍️', n: ['Crayons', 'Crayones'], f: [
    ['Crayola crayons were first sold in 1903. A box of 8 cost 5 cents.', 'Los crayones Crayola se vendieron por primera vez en 1903. Una caja de 8 costaba 5 centavos.'],
    ['The first 8 Crayola colors were red, orange, yellow, green, blue, violet, brown and black.', 'Los primeros 8 colores de Crayola fueron rojo, naranja, amarillo, verde, azul, violeta, café y negro.'],
    ['The name Crayola mixes "craie," the French word for chalk, with "ola," from a word that means oily.', 'El nombre Crayola junta "craie", que es tiza en francés, con "ola", de una palabra que quiere decir aceitoso.'],
    ['Alice Binney, a teacher, came up with the name Crayola. Her husband ran the company.', 'Alice Binney, una maestra, inventó el nombre Crayola. Su esposo dirigía la compañía.'],
    ['Crayons are made of wax mixed with colored powder called pigment.', 'Los crayones están hechos de cera mezclada con un polvo de color llamado pigmento.'],
    ['To make crayons, melted colored wax is poured into molds shaped like crayons, cooled, and then wrapped in paper labels.', 'Para hacer crayones, la cera de color derretida se echa en moldes con forma de crayón, se enfría y luego se envuelve con etiquetas de papel.'],
    ['The box of 64 crayons with a sharpener built in came out in 1958.', 'La caja de 64 crayones con sacapuntas integrado salió en 1958.'],
    ['In 1990, Crayola retired 8 colors for the very first time to make room for new ones.', 'En 1990, Crayola retiró 8 colores por primera vez para hacer lugar a colores nuevos.'],
    ['The crayon color "Bluetiful" came out in 2017. It was inspired by a new blue that scientists discovered by accident in 2009.', 'El color "Bluetiful" salió en 2017. Se inspiró en un azul nuevo que unos científicos descubrieron por accidente en 2009.'],
    ['The word crayon means pencil in French.', 'La palabra crayon quiere decir lápiz en francés.'],
    ['Old, broken crayons can be melted down and made into brand new crayons.', 'Los crayones viejos y rotos se pueden derretir para hacer crayones nuevos.']
  ] },
  { id: 'games', e: '🎮', n: ['Video games', 'Videojuegos'], f: [
    ['One of the first video games, "Tennis for Two," was made in 1958 on a science lab computer.', 'Uno de los primeros videojuegos, "Tennis for Two", se hizo en 1958 en una computadora de un laboratorio de ciencias.'],
    ['The first video game system for the home, the Magnavox Odyssey, came out in 1972.', 'La primera consola de videojuegos para la casa, el Magnavox Odyssey, salió en 1972.'],
    ['Pong, a game like ping-pong, became a hit in arcades in 1972.', 'Pong, un juego como el ping-pong, fue un éxito en las maquinitas en 1972.'],
    ['Nintendo started in 1889 in Japan, making playing cards!', '¡Nintendo empezó en 1889 en Japón haciendo cartas para jugar!'],
    ['Mario first showed up in the game Donkey Kong in 1981. Back then he was called Jumpman.', 'Mario apareció por primera vez en el juego Donkey Kong en 1981. En ese tiempo se llamaba Jumpman.'],
    ['Pac-Man\'s shape was inspired by a pizza with one slice missing.', 'La forma de Pac-Man se inspiró en una pizza a la que le faltaba una rebanada.'],
    ['Tetris was made in 1984 by Alexey Pajitnov, a computer scientist in Moscow.', 'Tetris lo creó en 1984 Alexey Pajitnov, un científico de computadoras en Moscú.'],
    ['The Game Boy came out in 1989. It ran on batteries so people could play anywhere.', 'El Game Boy salió en 1989. Funcionaba con pilas para que la gente pudiera jugar en cualquier lugar.'],
    ['Sonic the Hedgehog first raced onto screens in 1991.', 'Sonic el Erizo apareció corriendo por primera vez en 1991.'],
    ['Minecraft has sold more than 300 million copies, more than almost any other video game.', 'Minecraft ha vendido más de 300 millones de copias, más que casi cualquier otro videojuego.'],
    ['In 2023, a 13-year-old became the first person ever to "beat" the original Nintendo Tetris by playing until the game froze.', 'En 2023, un niño de 13 años fue la primera persona en "ganarle" al Tetris original de Nintendo, jugando hasta que el juego se congeló.'],
    ['Making a video game takes a team: artists, writers, musicians and coders who write the instructions for the computer.', 'Hacer un videojuego necesita un equipo: artistas, escritores, músicos y programadores que escriben las instrucciones para la computadora.']
  ] },
  { id: 'science', e: '🔬', n: ['Science', 'Ciencia'], f: [
    ['An octopus has three hearts and blue blood.', 'Un pulpo tiene tres corazones y sangre azul.'],
    ['Babies are born with about 300 bones. Some grow together, so grown-ups have 206.', 'Los bebés nacen con unos 300 huesos. Algunos se unen al crecer, así que los adultos tienen 206.'],
    ['Your heart beats about 100,000 times every day.', 'Tu corazón late unas 100,000 veces cada día.'],
    ['Sound travels about four times faster in water than in air.', 'El sonido viaja como cuatro veces más rápido en el agua que en el aire.'],
    ['Light is the fastest thing there is. It travels about 186,000 miles every second.', 'La luz es lo más rápido que existe. Viaja unos 300,000 kilómetros cada segundo.'],
    ['Plants make their own food from sunlight, water and air. This is called photosynthesis.', 'Las plantas hacen su propia comida con luz del sol, agua y aire. Esto se llama fotosíntesis.'],
    ['Everything is made of tiny pieces called atoms. Millions of them could fit across the dot at the end of this sentence.', 'Todo está hecho de pedacitos llamados átomos. Millones de ellos cabrían en el punto al final de esta oración.'],
    ['Magnets have a north end and a south end. A north end and a south end pull toward each other.', 'Los imanes tienen un polo norte y un polo sur. Un polo norte y un polo sur se atraen.'],
    ['Water boils at a lower temperature on top of a tall mountain, because there is less air pushing down.', 'El agua hierve a menor temperatura arriba de una montaña alta, porque hay menos aire empujando hacia abajo.'],
    ['Honey can last a very long time, because germs have a hard time growing in it.', 'La miel puede durar muchísimo tiempo, porque a los gérmenes les cuesta crecer en ella.'],
    ['Bananas are a tiny bit radioactive because of the potassium in them, but they are totally safe and healthy to eat!', 'Los plátanos son un poquito radiactivos por el potasio que tienen, ¡pero son totalmente seguros y sanos para comer!'],
    ['Isaac Newton explained gravity, the pull that keeps your feet on the ground and the Moon going around Earth.', 'Isaac Newton explicó la gravedad, la fuerza que mantiene tus pies en el suelo y a la Luna girando alrededor de la Tierra.']
  ] },
  { id: 'movies', e: '🎬', n: ['Movies', 'Películas'], f: [
    ['The first movies had no talking. They were called silent films, and music was often played live in the theater.', 'Las primeras películas no tenían voces. Se llamaban películas mudas, y muchas veces tocaban música en vivo en el cine.'],
    ['The Jazz Singer, in 1927, was the first full-length movie with talking that matched the actors\' lips.', 'El cantante de jazz, de 1927, fue la primera película larga con voces que coincidían con los labios de los actores.'],
    ['A movie is really lots of still pictures shown fast, usually 24 every second. Your brain sees them as moving.', 'Una película son muchas fotos quietas que pasan rápido, casi siempre 24 cada segundo. Tu cerebro las ve en movimiento.'],
    ['Snow White and the Seven Dwarfs, from 1937, was Disney\'s first full-length animated movie.', 'Blancanieves y los siete enanos, de 1937, fue la primera película animada larga de Disney.'],
    ['Toy Story, from 1995, was the first full-length movie made completely with computer animation.', 'Toy Story, de 1995, fue la primera película larga hecha completamente con animación por computadora.'],
    ['Popcorn became the favorite movie snack in the 1930s because it was cheap and easy to make.', 'Las palomitas se volvieron la botana favorita del cine en los años 1930 porque eran baratas y fáciles de hacer.'],
    ['The Oscars, the big movie awards, started in 1929.', 'Los Óscar, los grandes premios del cine, empezaron en 1929.'],
    ['The famous Hollywood sign first said "HOLLYWOODLAND." It was built in 1923 to sell houses.', 'El famoso letrero de Hollywood primero decía "HOLLYWOODLAND". Lo pusieron en 1923 para vender casas.'],
    ['Foley artists make movie sounds by hand, like snapping celery for a crunch or walking in gravel for footsteps.', 'Los artistas de Foley hacen los sonidos de las películas a mano, como romper apio para un crujido o caminar en grava para los pasos.'],
    ['A green screen lets filmmakers add a different background later, like outer space or a jungle.', 'Una pantalla verde deja que los cineastas pongan otro fondo después, como el espacio o una selva.'],
    ['In cartoon movies, the actors usually record the voices first, and the animators draw to match.', 'En las películas animadas, los actores casi siempre graban las voces primero, y los animadores dibujan para que coincidan.'],
    ['The list of names at the end of a movie is called the credits. Big movies can have thousands of names!', 'La lista de nombres al final de una película se llama créditos. ¡Las películas grandes pueden tener miles de nombres!']
  ] },
  { id: 'books', e: '📚', n: ['Books', 'Libros'], f: [
    ['Dr. Seuss wrote Green Eggs and Ham using only 50 different words. His publisher bet him he couldn\'t do it!', 'Dr. Seuss escribió Huevos verdes con jamón usando solo 50 palabras diferentes. ¡Su editor le apostó que no podría!'],
    ['Dav Pilkey, who made Dog Man and Captain Underpants, has ADHD and dyslexia. As a kid, he drew comics while sitting in the school hallway.', 'Dav Pilkey, el creador de Dog Man y del Capitán Calzoncillos, tiene TDAH y dislexia. De niño, dibujaba cómics sentado en el pasillo de la escuela.'],
    ['Around the year 1440, Johannes Gutenberg made a printing press that could make many copies of a book fast.', 'Alrededor del año 1440, Johannes Gutenberg hizo una imprenta que podía hacer muchas copias de un libro rápido.'],
    ['Before printing presses, every book had to be copied by hand, one letter at a time.', 'Antes de las imprentas, cada libro se tenía que copiar a mano, letra por letra.'],
    ['Paper was invented in China about 2,000 years ago.', 'El papel se inventó en China hace unos 2,000 años.'],
    ['One of the oldest stories ever written, The Epic of Gilgamesh, is about 4,000 years old.', 'Una de las historias escritas más antiguas, la Epopeya de Gilgamesh, tiene como 4,000 años.'],
    ['Louis Braille was 15 years old when he created braille, a way to read with your fingertips using raised dots.', 'Louis Braille tenía 15 años cuando creó el braille, una forma de leer con la punta de los dedos usando puntitos en relieve.'],
    ['The Harry Potter books have been translated into more than 80 languages.', 'Los libros de Harry Potter se han traducido a más de 80 idiomas.'],
    ['The Very Hungry Caterpillar by Eric Carle has sold more than 50 million copies.', 'La oruga muy hambrienta, de Eric Carle, ha vendido más de 50 millones de copias.'],
    ['The Library of Congress in Washington, D.C., is the biggest library in the world, with millions of books.', 'La Biblioteca del Congreso en Washington, D.C., es la biblioteca más grande del mundo, con millones de libros.'],
    ['The word library comes from "liber," the Latin word for book.', 'La palabra "library" (biblioteca en inglés) viene de "liber", la palabra en latín para libro.']
  ] },
  { id: 'cars', e: '🚗', n: ['Cars', 'Carros'], f: [
    ['Karl Benz in Germany got a patent in 1886 for one of the first cars that ran on gas.', 'Karl Benz, en Alemania, recibió una patente en 1886 por uno de los primeros carros de gasolina.'],
    ['Electric cars were already driving around in the late 1800s!', '¡Ya había carros eléctricos rodando a finales de los años 1800!'],
    ['Henry Ford\'s Model T came out in 1908. His factory\'s moving assembly line made cars cheaper, so more families could buy one.', 'El Modelo T de Henry Ford salió en 1908. La línea de ensamblaje de su fábrica hizo los carros más baratos, y más familias pudieron comprar uno.'],
    ['Mary Anderson got a patent for windshield wipers in 1903, after watching a driver struggle to see in the snow.', 'Mary Anderson patentó el limpiaparabrisas en 1903, después de ver a un conductor que no podía ver con la nieve.'],
    ['The three-point seat belt was invented in 1959 by Nils Bohlin at Volvo. Volvo shared the idea for free to keep everyone safer.', 'El cinturón de seguridad de tres puntos lo inventó Nils Bohlin en Volvo en 1959. Volvo compartió la idea gratis para que todos estuvieran más seguros.'],
    ['One of the first speeding tickets was given in England in 1896, to a driver going 8 miles per hour!', 'Una de las primeras multas por exceso de velocidad se dio en Inglaterra en 1896, ¡a un conductor que iba a 13 kilómetros por hora!'],
    ['A car is made of about 30,000 parts, counting every little screw.', 'Un carro tiene como 30,000 piezas, contando cada tornillito.'],
    ['Tires are black because of carbon black, a powder that makes the rubber stronger.', 'Las llantas son negras por el negro de humo, un polvo que hace más fuerte el hule.'],
    ['Horsepower compares an engine\'s power to the work a horse can do.', 'Los caballos de fuerza comparan la potencia de un motor con el trabajo que puede hacer un caballo.'],
    ['Formula 1 race cars can go faster than 200 miles per hour.', 'Los carros de carreras de Fórmula 1 pueden ir a más de 320 kilómetros por hora.'],

/* ============================== Phone reminders (for the app's own website) ==============================
   1. Calendar file: every task with a time becomes a repeating event with an alert, so the phone
      rings even when the app is closed. Works today on iPhone and Android.
   2. App notifications: needs the small reminder service described in the beta plan. It turns on
      when window.AZ_PUSH = { url, key } is set. The service only ever learns times and a time zone;
      names and task words stay on this device. */
function remindItems() {
  const out = [];
  for (const k of kids()) {
    const ch = chartOf(k.id);
    for (const s of ch.sections) {
      if (s.helper || s.kind === 'offday') continue;
      if (s.kind === 'weekend' && !ch.weekendOn) continue;
      const sdays = s.kind === 'weekend' ? (s.days && s.days.length ? s.days : [0, 6]) : (s.days || ALLDAYS);
      for (const st of s.steps) {
        if (!st.time || st.type === 'checkin') continue;
        const days = (st.days && st.days.length ? st.days.filter(d => sdays.includes(d)) : sdays.slice()).sort();
        if (!days.length) continue;
        out.push({ key: k.id + '|' + st.id, k, s, st, days, time: st.time });
      }
    }
  }
  return out.sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : a.k.name < b.k.name ? -1 : 1));
}

const remOn = it => !remCfg().off[it.key];

const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];

function remBody(it) { return it.st.sub ? tr(it.st.sub) : `${tr(it.s.n)} · ${appName()}`; }
function icsText(items) {
  const cfg = remCfg(), esc2 = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//A-Z//Family routines//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + esc2(appName() + ' ' + tr('reminders'))];

    const dur = Math.max(5, Math.min(60, stMins(it.st)[0] || 10));
    L.push('BEGIN:VEVENT', `UID:${it.k.id}-${it.st.id}@a-z-family`, 'DTSTAMP:' + stamp, 'DTSTART:' + icsDate(firstDate(it.days), it.time), `DURATION:PT${dur}M`,

const PXCELL = {}, PXC = {};
const pxKey = e => String(e).replace(/\uFE0F/g, '');
function pxCells(e) {
  const key = pxKey(e);
  if (key in PXCELL) return PXCELL[key];
  const a = PXART[key]; if (!a) return (PXCELL[key] = null);
  const W = 18, col = new Array(W * W).fill(null), fill = new Uint8Array(W * W);
  a.split('|').forEach((r, y) => { for (let x = 0; x < r.length; x++) { const ch = r[x]; if (ch === '.' || !PXPAL[ch]) continue; const i = (y + 1) * W + x + 1; col[i] = PXPAL[ch]; if (!PXNO.includes(ch)) fill[i] = 1; } });
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (col[i]) continue;
    if ((x > 0 && fill[i - 1]) || (x < W - 1 && fill[i + 1]) || (y > 0 && fill[i - W]) || (y < W - 1 && fill[i + W])) col[i] = PXPAL.k;
  }
  const runs = [];
  for (let y = 0; y < W; y++) { let x = 0; while (x < W) { const c = col[y * W + x]; if (!c) { x++; continue; } let x2 = x; while (x2 + 1 < W && col[y * W + x2 + 1] === c) x2++; runs.push([x, y, x2 - x + 1, c]); x = x2 + 1; } }
  return (PXCELL[key] = runs);
}
function pxURL(e) {
  const key = pxKey(e);
  if (key in PXC) return PXC[key];
  const runs = pxCells(key); if (!runs) return (PXC[key] = null);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" shape-rendering="crispEdges">${runs.map(([x, y, w, c]) => `<rect x="${x}" y="${y}" width="${w}" height="1" fill="${c}"/>`).join('')}</svg>`;
  return (PXC[key] = 'data:image/svg+xml,' + encodeURIComponent(svg));
}
/* Draw a pixel picture on a canvas, centred on (cx, cy), size = width in canvas units. Returns false if there is no picture. */
function pxDraw(ctx, e, cx, cy, size) {
  const runs = pxCells(e); if (!runs) return false;
  const u = size / 18, x0 = cx - size / 2, y0 = cy - size / 2;
  ctx.save(); ctx.globalAlpha = 1;
  for (const [x, y, w, c] of runs) { ctx.fillStyle = c; ctx.fillRect(x0 + x * u, y0 + y * u, w * u + 0.04, u + 0.04); }
  ctx.restore(); return true;
}
let PXRE = null;
function pxRe() {
  if (!PXRE) PXRE = new RegExp(Object.keys(PXART).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\uFE0F?').join('|'), 'gu');

}

  if (!root) return;

  const hits = [];
  for (let n = w.nextNode(); n; n = w.nextNode()) if (pxRe().test(n.nodeValue)) hits.push(n);
  for (const n of hits) {
    const s = n.nodeValue, frag = document.createDocumentFragment(); let last = 0;
    s.replace(pxRe(), (m, i) => {

      const u = pxURL(m);
      if (u) { const im = document.createElement('img'); im.className = 'px'; im.src = u; im.alt = m; im.draggable = false; frag.append(im); } else frag.append(m);

}
